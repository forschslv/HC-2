{% extends "base.html" %}
{% block title %}Ошибка - Хакатон{% endblock %}
{% block content %}
<div class="row mt-5">
    <div class="col-md-6 mx-auto text-center">
        <div class="card">
            <div class="card-body">
                <h1 class="display-1 text-danger">{{ error_code }}</h1>
                <h2>{{ error_message }}</h2>
                <p class="text-muted">Проверьте правильность адреса или вернитесь на главную.</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">← На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
