{% extends "base.html" %}
{% block title %}Статистика - Хакатон{% endblock %}
{% block content %}
<h1>📊 Статистика</h1>
<div class="row mb-4">
    <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6>Товаров</h6><p class="display-5">{{ total_products }}</p></div></div></div>
    <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6>Заказов</h6><p class="display-5">{{ total_orders }}</p></div></div></div>
    <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6>Сред. цена</h6><p class="display-5">{{ "%.2f"|format(avg_price) }} ₽</p></div></div></div>
    <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6>Доход</h6><p class="display-5">{{ "%.2f"|format(total_revenue) }} ₽</p></div></div></div>
</div>
<div class="card"><div class="card-body"><h5>📈 Диаграммы</h5><img src="{{ url_for('static', filename='charts/statistics.png') }}" alt="Статистика" class="img-fluid"></div></div>
{% endblock %}
